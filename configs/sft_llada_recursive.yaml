experiment:
    project: "sft_llada_recursive"
    num_node: 1

model:
    pretrained_model: "GSAI-ML/LLaDA-8B-Instruct"
    optimized_name: "optimized_recursive"

dataset:
    optimization_data: "sft_demon_openr1math_llada"

training:
    gradient_checkpointing_enable: False  # Enable to save memory
    gradient_accumulation_steps: 4  # Increase to maintain effective batch size
    batch_size_lm: 1  # Reduce to 1 to save memory
    mixed_precision: "bf16"
    enable_tf32: False
    seed: 42
    num_train_epochs: 1
    max_grad_norm: 1
    freeze_first_half_layers: True  # Freeze first half of transformer layers
    
    # Masking strategy
    method: "random_masking"
    lower_p: 0.1
    upper_p: 0.9
    block_size: 32
    mask_times_per_sample: 5  # Further reduce to 3
    post_num: 0
    max_gen_length: 1024  # Reduce to 512 for memory
    max_prompt_len: 784  # Reduce to 384
    
    # Latent Recursive parameters
    use_latent_recursive: True
    R: 1 # latent recursive steps (before every unmask steps)
    recursive_in_training: True

optimizer:
    name: adamw
    params:
        learning_rate: 1e-5
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.0
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 0
        min_lr_scale: 1.0

# Logging configuration
logging:
    use_tensorboard: True
    log_dir: "tensorboard_logs"
    log_interval: 5
