experiment:
    project: "llada_eval_recursive" # need to be same of this file name
    num_node: 1 # the number of machines you have
    node_index: 0 # no need to change


model_path: "/geminicephfs/game-center-recmd/wilfredguan/dLLM-RL/sft_llada_recursive/ckpt/optimized_recursive" # absolute path of your model
model_base: "llada" # set llada for LLaDA and MMaDA
model:
    freeze_first_half_layers: True  # Set to True if model was trained with frozen first half layers
    trainable_layer_start_idx: 16   # Starting index of trainable layers (e.g., 16 for 32-layer model)

# dataset you want to eval on, you need to download first, you can also modify your own dataset, see instructions in ./data
dataset:
    eval_dataset: "GSM8K" #"MBPP""MATH500""GSM8K""AIME2024""GPQA""LiveCodeBench""HumanEval""LiveBench"
    data_type: "math" #"code""math"

execute:
    num_chunk: 128 # batch size of executing codes in coding eval tasks

rollout:
    num_response_per_task: 1
    temperature: 1.0
    max_gen_length: 1024
    batch_size: 1
    remasking_strategy: "low_confidence_static" #"low_confidence_static""low_confidence_dynamic"
    target: "confidence" # target to decide which tokens to unmask, eg. confidence, margin_confidence and neg_entropy
    dynamic_threshold: null #0.95 # no use for "low_confidence_static"
    further_horizon: 128 # We find that performing the forward pass with a further horizon, eg. 128, (kv-cache sequence before current block, while doing full forward for currect [block_size + further_horizon] length sequence) yields competitive performance to running without KV-cache. Balances speed and performance.
    output_unmasking_history: True
    use_cache: True
    
    # ========== [R+N] Parameters ==========
    # Core logic: Each cycle executes [R latent thinking steps + N normal forward steps]
    # Each normal forward step unmasks unmask_token_number_per_step tokens
    
    R: 2                              # Number of latent thinking steps per cycle
    N: 1                              # Number of normal forward steps per cycle
    unmask_token_number_per_step: 1   # Number of tokens to unmask per forward step
    block_size: 32                    # Total tokens processed per block
                                      # Constraint: block_size must be divisible by (N * unmask_token_number_per_step)
    
    # ========== Calculation Example ==========
    # With R=2, N=4, unmask_token_number_per_step=1, block_size=32:
    # - Tokens per cycle = N * unmask_token_number_per_step = 4 * 1 = 4
    # - Cycles per block = 32 / 4 = 8
    # - Each cycle: 2 latent thinking + 4 forward steps (each unmask 1 token)
    # - NFE per cycle = R + N = 2 + 4 = 6
    # - Total blocks = 1024 / 32 = 32
    # - Total NFE = 32 blocks × 8 cycles × 6 = 1536
